<!doctype html>
<html lang="af">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Titanic — Baba Fourie Finale</title>

<meta name="robots" content="noindex,nofollow,noarchive">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 50% 0%,#17385b,#07192d 45%,#020914);
    font-family:Georgia,'Times New Roman',serif;
    color:#fff;
}

/* Stars */

.stars{
    position:fixed;
    inset:0;
    background-image:
        radial-gradient(#fff9 1px,transparent 1px);
    background-size:40px 40px;
    opacity:.22;
    pointer-events:none;
}

/* Ocean */

.ocean{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:20vh;
    background:
        repeating-radial-gradient(
            ellipse at 50% 100%,
            #0b3151 0 8px,
            #071b31 9px 18px
        );
    opacity:.65;
    pointer-events:none;
}

/* Main Titanic card */

.card{
    width:min(92vw,680px);
    padding:42px 32px;
    text-align:center;
    position:relative;
    z-index:2;

    background:
        linear-gradient(
            145deg,
            #102942f5,
            #061322f7
        );

    border:3px double #d8b55b;
    border-radius:6px;

    box-shadow:
        0 25px 80px #000c,
        0 0 45px #c9a84d33;
}

.card:before{
    content:"⚓  ✦  RMS TITANIC  ✦  ⚓";
    display:block;
    color:#e2c36d;
    letter-spacing:.25em;
    font-size:14px;
    margin-bottom:18px;
}

.kicker{
    color:#e2c36d;
    text-transform:uppercase;
    letter-spacing:.22em;
    font-size:12px;
}

.line{
    width:130px;
    height:1px;
    background:#d8b55b;
    margin:18px auto;
}

h1{
    font-size:clamp(31px,6vw,52px);
    margin:8px 0 12px;
}

p{
    font-family:Arial,sans-serif;
    color:#e2e8ef;
    line-height:1.6;
    max-width:530px;
    margin:8px auto;
}

/* Password form */

.form{
    display:flex;
    gap:10px;
    max-width:470px;
    margin:28px auto 0;
}

input{
    flex:1;
    min-width:0;
    padding:15px 16px;
    font-size:17px;
    letter-spacing:.08em;

    border:2px solid #d8b55b;
    border-radius:6px;

    background:#f6f0df;
    color:#07192d;
}

button{
    padding:0 22px;
    border:0;
    border-radius:6px;

    background:#d8b55b;
    color:#07192d;

    font-weight:800;
    text-transform:uppercase;
    cursor:pointer;
}

button:hover{
    background:#efd37f;
}

.msg{
    min-height:24px;
    margin-top:14px;

    color:#ffb9c9;

    font-family:Arial,sans-serif;
    font-size:14px;
}

/* Hide reveal until password is correct */

.hidden{
    display:none !important;
}

/* Reveal animation */

#reveal{
    animation:reveal 1.2s ease both;
}

/* Your Anja reveal card */

.reveal-image{
    display:block;
    width:100%;
    max-width:650px;
    height:auto;
    margin:0 auto;

    border-radius:8px;

    box-shadow:
        0 15px 45px #0009,
        0 0 30px #d8b55b33;
}

/* Pink/gold confetti */

.confetti{
    position:fixed;
    top:-30px;

    width:10px;
    height:16px;

    background:#ffd0e4;

    animation:fall linear forwards;

    z-index:10;
    pointer-events:none;
}

.confetti:nth-child(even){
    background:#d8b55b;
}

@keyframes fall{

    to{
        transform:
            translateY(110vh)
            rotate(1000deg);
    }

}

@keyframes reveal{

    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.94);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}

/* Mobile */

@media(max-width:560px){

    .card{
        padding:35px 20px;
    }

    .form{
        flex-direction:column;
    }

    button{
        padding:15px;
    }

}

</style>
</head>


<body>

<div class="stars"></div>
<div class="ocean"></div>


<!-- LOCKED TITANIC SCREEN -->

<main class="card" id="lock">

    <div class="kicker">
        Die Laaste Reis • Finale
    </div>

    <div class="line"></div>

    <h1>
        Die finale kluis is gesluit…
    </h1>

    <p>
        Julle het die leidrade gevolg,
        die geheime van die Titanic ontrafel
        en die einde van die reis bereik.
    </p>

    <p>
        <strong>
            Voer julle finale Titanic-kode in:
        </strong>
    </p>

    <div class="form">

        <input
            id="code"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Geheime kode"
        >

        <button id="unlock">
            Ontsluit
        </button>

    </div>

    <div
        class="msg"
        id="msg">
    </div>

</main>


<!-- REVEAL SCREEN -->

<main
    class="card hidden"
    id="reveal">

    <div class="kicker">
        Die geheim is ontsluit…
    </div>

    <div class="line"></div>

    <img
        src="1000368526.png"
        alt="Baba Fourie"
        class="reveal-image"
    >

</main>


<script>

/* TITANIC CODE */

const valid = '375284964';

const code =
    document.getElementById('code');

const msg =
    document.getElementById('msg');


function unlockReveal(){

    if(code.value.trim() === valid){

        /* Hide password screen */

        document
            .getElementById('lock')
            .classList
            .add('hidden');


        /* Show your Anja card */

        document
            .getElementById('reveal')
            .classList
            .remove('hidden');


        /* Confetti */

        for(let i = 0; i < 90; i++){

            const confetti =
                document.createElement('i');

            confetti.className =
                'confetti';

            confetti.style.left =
                Math.random() * 100 + 'vw';

            confetti.style.animationDuration =
                (2.5 + Math.random() * 3) + 's';

            confetti.style.animationDelay =
                Math.random() * 1.1 + 's';

            document.body
                .appendChild(confetti);

            setTimeout(
                () => confetti.remove(),
                6500
            );

        }

    }

    else{

        msg.textContent =
            'Die kode is nie korrek nie… probeer weer!';

        code.select();

    }

}


/* Unlock button */

document
    .getElementById('unlock')
    .addEventListener(
        'click',
        unlockReveal
    );


/* Enter key */

code.addEventListener(
    'keydown',
    function(event){

        if(event.key === 'Enter'){
            unlockReveal();
        }

    }
);

</script>

</body>
</html>
